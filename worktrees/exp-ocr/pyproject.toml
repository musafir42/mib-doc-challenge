[project]
name = "mib-solution"
version = "0.1.0"
description = "MIB Doc Challenge offline intake pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pypdf>=5.0.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
mib-solution = "mib_solution.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modal>=1.0.0",
]
